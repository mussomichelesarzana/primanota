<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestione prima nota</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background-color: #000000;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen pb-20">

  <!-- Matrix Canvas -->
  <canvas id="matrix-canvas"></canvas>

  <!-- Login Modal -->
  <div id="login-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-900/95 p-8 rounded-3xl w-full max-w-sm border border-emerald-500/40 shadow-[0_0_50px_rgba(16,185,129,0.3)] text-center relative z-10 backdrop-blur-md">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 mb-4 text-emerald-400 font-mono text-2xl font-bold">
        &gt;_
      </div>
      <h2 class="text-2xl font-black mb-1 text-white tracking-wide">Gestione prima nota</h2>
      <p class="text-xs text-emerald-400 font-mono mb-6">Autenticazione Richiesta</p>

      <form id="login-form" class="space-y-4 text-left">
        <div>
          <label class="block text-[10px] uppercase tracking-wider text-gray-400 font-bold mb-1 font-mono">Username</label>
          <input type="text" id="username" class="w-full bg-gray-800/90 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition" required placeholder="Inserisci username">
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-wider text-gray-400 font-bold mb-1 font-mono">Password</label>
          <input type="password" id="password" class="w-full bg-gray-800/90 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition" required placeholder="••••••••">
        </div>
        
        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center gap-2 text-gray-300 cursor-pointer">
            <input type="checkbox" id="remember-me" class="rounded bg-gray-800 border-gray-700 text-emerald-500 focus:ring-emerald-500" checked>
            <span>Ricorda credenziali</span>
          </label>
        </div>

        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-gray-950 font-black py-3.5 rounded-xl transition shadow-lg shadow-emerald-500/25 uppercase text-sm tracking-wider mt-2">Accedi</button>
      </form>
    </div>
  </div>

  <!-- Main App UI -->
  <div id="app" class="hidden max-w-md mx-auto p-4 relative z-10">
    
    <!-- Header Balances Breakdown -->
    <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 mb-4 shadow-md">
      <div class="flex justify-between items-center mb-3">
        <span class="text-xs text-gray-400 uppercase font-bold tracking-wider">Disponibilità e Saldi</span>
        <button onclick="logout()" class="text-xs bg-gray-700 hover:bg-gray-600 px-2.5 py-1 rounded-lg text-gray-300 transition">Esci</button>
      </div>

      <div class="grid grid-cols-3 gap-2 text-center mb-2">
        <!-- Contanti -->
        <div class="bg-gray-900/60 p-2.5 rounded-xl border border-gray-700/60">
          <div class="text-[10px] uppercase text-gray-400 font-semibold mb-1">Contanti</div>
          <div id="bal-cash" class="text-xs font-black text-emerald-400">0,00 €</div>
        </div>
        <!-- Banca / Bancomat -->
        <div class="bg-gray-900/60 p-2.5 rounded-xl border border-gray-700/60">
          <div class="text-[10px] uppercase text-gray-400 font-semibold mb-1">Banca</div>
          <div id="bal-banca" class="text-xs font-black text-emerald-400">0,00 €</div>
        </div>
        <!-- Carta di Credito -->
        <div class="bg-gray-900/60 p-2.5 rounded-xl border border-gray-700/60">
          <div class="text-[10px] uppercase text-gray-400 font-semibold mb-1">Carta (Addebiti)</div>
          <div id="bal-carta" class="text-xs font-black text-rose-400">0,00 €</div>
        </div>
      </div>

      <!-- Info Spese Programmate -->
      <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl px-3 py-1.5 mb-3 flex justify-between items-center text-[11px]">
        <span class="text-amber-300 font-semibold flex items-center gap-1">🕒 Uscite/Entrate Previste:</span>
        <span id="bal-planned" class="font-bold text-amber-400">0,00 €</span>
      </div>

      <!-- Backup & Restore Buttons -->
      <div class="flex gap-2 border-t border-gray-700/60 pt-3">
        <button onclick="exportData()" class="flex-1 bg-gray-700/80 hover:bg-gray-600 text-[11px] py-1.5 px-2 rounded-xl text-emerald-400 font-bold border border-gray-600 flex items-center justify-center gap-1 transition">
          ⬇️ Esporta Backup
        </button>
        <button onclick="document.getElementById('import-file').click()" class="flex-1 bg-gray-700/80 hover:bg-gray-600 text-[11px] py-1.5 px-2 rounded-xl text-amber-400 font-bold border border-gray-600 flex items-center justify-center gap-1 transition">
          ⬆️ Importa Backup
        </button>
        <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
      </div>
    </div>

    <!-- Form Registrazione / Modifica -->
    <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 mb-6 shadow-lg">
      <div class="flex justify-between items-center mb-4">
        <h3 id="form-title" class="text-sm font-semibold text-gray-300 uppercase tracking-wider">Nuova Registrazione</h3>
        <button type="button" id="btn-cancel-edit" onclick="resetForm()" class="hidden text-xs text-rose-400 underline font-semibold">Annulla Modifica</button>
      </div>

      <form id="transaction-form" class="space-y-4">
        <input type="hidden" id="edit-id" value="">

        <div class="grid grid-cols-2 gap-2">
          <button type="button" id="btn-spesa" onclick="setType('spesa')" class="py-2.5 rounded-xl font-bold bg-rose-500 text-white transition">Spesa</button>
          <button type="button" id="btn-incasso" onclick="setType('incasso')" class="py-2.5 rounded-xl font-bold bg-gray-700 text-gray-300 transition">Incasso</button>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Importo (€)</label>
            <input type="number" step="0.01" id="amount" placeholder="0.00" class="w-full bg-gray-700 border border-gray-600 rounded-xl p-3 text-white text-lg font-bold focus:outline-none focus:border-emerald-500" required>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Data</label>
            <input type="date" id="date" class="w-full bg-gray-700 border border-gray-600 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500" required>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <div class="flex justify-between items-center mb-1">
			  <label class="text-xs text-gray-400">Categoria</label>
			  <div class="flex gap-1.5 text-xs font-semibold">
				<button type="button" onclick="addCategory()" class="text-emerald-400 hover:underline">+ Nuova</button>
				<span class="text-gray-600">|</span>
				<button type="button" onclick="editCurrentCategory()" class="text-amber-400 hover:underline">✏️ Modifica</button>
				<span class="text-gray-600">|</span>
				<button type="button" onclick="deleteCurrentCategory()" class="text-rose-400 hover:underline">🗑️ Elimina</button>
			  </div>
			</div>
            <select id="category" class="w-full bg-gray-700 border border-gray-600 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500" required></select>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Stato Movimento</label>
            <select id="status" class="w-full bg-gray-700 border border-gray-600 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500" required>
              <option value="confirmed">Confermato</option>
              <option value="planned">Pianificato</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1">Conto / Metodo</label>
          <select id="account" class="w-full bg-gray-700 border border-gray-600 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500" required>
            <option value="cash">Contanti</option>
            <option value="banca">Banca / Bancomat</option>
            <option value="carta">Carta di Credito</option>
          </select>
        </div>

        <div>
          <label class="block text-xs text-gray-400 mb-1">Note (opzionale)</label>
          <input type="text" id="note" placeholder="Descrizione..." class="w-full bg-gray-700 border border-gray-600 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-emerald-500">
        </div>

        <button type="submit" id="btn-submit" class="w-full bg-emerald-500 active:bg-emerald-600 text-gray-950 font-black py-3.5 rounded-xl text-base transition shadow-lg shadow-emerald-500/20">Salva</button>
      </form>
    </div>

    <div class="bg-gray-800 p-3 rounded-2xl border border-gray-700 mb-4 shadow-md flex items-center justify-between gap-2">
      <span class="text-xs text-gray-400 font-semibold uppercase">Filtra Periodo:</span>
      <input type="month" id="month-filter" onchange="loadData()" class="bg-gray-700 border border-gray-600 rounded-xl px-3 py-1.5 text-white text-sm focus:outline-none focus:border-emerald-500">
    </div>

    <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow-md">
      <div class="flex border-b border-gray-700 mb-4">
        <button onclick="showTab('history')" id="tab-history" class="flex-1 py-2 text-center text-sm font-bold border-b-2 border-emerald-400 text-emerald-400">Movimenti</button>
        <button onclick="showTab('stats')" id="tab-stats" class="flex-1 py-2 text-center text-sm font-bold text-gray-400">Statistiche</button>
      </div>

      <div id="content-history" class="space-y-3 max-h-96 overflow-y-auto"></div>

      <div id="content-stats" class="hidden space-y-6">
        <div>
          <div class="flex justify-between items-center mb-3">
            <span class="text-xs font-semibold text-gray-400 uppercase">Resoconto per Categoria</span>
            <select id="stats-sort" onchange="loadData()" class="bg-gray-700 text-xs border border-gray-600 rounded-lg px-2 py-1 text-gray-200 focus:outline-none focus:border-emerald-500">
              <option value="alpha">Alfabetico</option>
              <option value="max">Maggiore Spesa</option>
              <option value="min">Minore Spesa</option>
            </select>
          </div>
          <div id="category-analysis" class="space-y-3"></div>
        </div>

        <div class="pt-2 border-t border-gray-700">
          <div class="flex justify-between items-center mb-3">
            <span class="text-xs font-semibold text-gray-400 uppercase">Ripartizione Spese</span>
            <div class="flex bg-gray-700 rounded-lg p-0.5 border border-gray-600">
              <button onclick="setChartType('doughnut')" id="btn-chart-doughnut" class="px-2 py-1 text-[10px] font-bold rounded-md bg-emerald-500 text-gray-950 transition">Torta</button>
              <button onclick="setChartType('bar')" id="btn-chart-bar" class="px-2 py-1 text-[10px] font-bold rounded-md text-gray-300 transition">Istogramma</button>
            </div>
          </div>
          <canvas id="chart-categories" class="w-full"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js?v=7"></script>
</body>
</html>
