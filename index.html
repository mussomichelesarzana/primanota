<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prima Nota Pro</title>
  
  <!-- PWA & Web App Metatag -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prima Nota">

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <!-- Login Modal -->
  <div id="login-modal" class="fixed inset-0 bg-gray-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-gray-800/90 border border-gray-700/80 p-6 rounded-2xl w-full max-w-sm shadow-2xl relative z-50">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 mb-3 border border-emerald-500/20">
          <i class="fa-solid fa-user-ninja text-2xl"></i>
        </div>
        <h2 class="text-xl font-black tracking-wide text-white uppercase">Prima Nota Pro</h2>
        <p class="text-xs text-gray-400 mt-1">Inserisci le credenziali di accesso</p>
      </div>

      <form id="login-form" onsubmit="doLogin(event)" action="#" method="POST" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Utente</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
              <i class="fa-solid fa-user"></i>
            </span>
            <input type="text" id="username" name="username" autocomplete="username" required class="w-full pl-9 pr-3 py-2.5 bg-gray-900 border border-gray-700 rounded-xl focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-white outline-none text-sm transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="password" name="password" autocomplete="current-password" required class="w-full pl-9 pr-10 py-2.5 bg-gray-900 border border-gray-700 rounded-xl focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-white outline-none text-sm transition">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-200">
              <i id="password-toggle-icon" class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 cursor-pointer text-xs text-gray-400">
            <input type="checkbox" id="remember-me" class="rounded bg-gray-900 border-gray-700 text-emerald-500 focus:ring-emerald-500">
            Ricordami
          </label>
        </div>

        <button type="submit" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 font-black text-gray-950 rounded-xl transition flex items-center justify-center gap-2 text-sm shadow-lg shadow-emerald-500/20">
          <span>Accedi</span>
          <i class="fa-solid fa-bolt"></i>
        </button>
      </form>
    </div>
  </div>

  <script src="app.js?v=4.1.0"></script>
</body>
</html>
